<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Music lesson Booking Service</title>
</head>
<body>
	<h1>Kofi's Music Lab</h1>
	<h2>Pupil Identity</h2>
	<h3>
		Matric<input type="text" id="id" placeholder="Matric Number"/>
    Name <input type="text" id="name" placeholder="Student name"/>
		<hr/>
	</h3>
  <div>
    <h1>Book lesson</h1>
    <h2>Tutor: 
	<select id="tutor">
	<option value="">Select a Tutor</option>
	</select>
	</h2>
    <h2>Teaches: <span id = "teaches"></span></h2>

    <button type="button" onclick="list_upcoming_lessons();">View upcoming lessons</button>
    <button type="button" onclick="list_availability();">List availability</button>
    <br>
    <h5>
    <select id="day"> 
        <option value="Mon">Mon</option>
        <option value="Tues">Tues</option>
        <option value="Wed">Wed</option>
        <option value="Thurs">Thurs</option>
        <option value="Fri">Fri</option>
        <option value="Sat">Sat</option>
    </select> 
    at
    <select id="slot"></select>
    <script>
        const time = ["09:00" , "09:30" , "10:00" , "10:30", "11:00" , "11:30" , "12:00" , "12:30" , "13:00" ,  "13:30"  , "14:00" , "14:30", "15:00" , "15:30"  , "16:00" , "16:30" , "17:00" ,"17:30" ,  "18:00"  ,  "18:30" ,"19:00" , "19:30" , "20:00"];
        const daySelect = document.getElementById("day");
		const timeSelect = document.getElementById("slot");
		function updateTimes(){
		let allTimes = time;
		
		if(daySelect.value === "Sat"){
		allTimes = time;
		}
		else{
		allTimes = time.filter(t=> t >= "16:00")
		
		}
		timeSelect.innerHTML = allTimes.map(t => `<option value="${t}">${t}</option>`).join("");
		}
		daySelect.addEventListener("change" , updateTimes);
		updateTimes();    
    </script> 
    <button type="button" onclick="cancel_booking();">Cancel lesson </button>
    </h5>
    <h2>
    Instrument <select id="instrument">
	<option value="">Please select a tutor first</option> 
   
    </select>
    
    <button type="button" onclick="book_lesson();">Book a lesson</button>
    </h2>
  </div>

  <div id="output"></div>

  <script>

    function list_upcoming_lessons(){
      const output = document.getElementById('output');
	  const stuId = document.getElementById('id').value;

      fetch('http://localhost:8080/viewAllBookings?id=' + encodeURIComponent(stuId))
        .then(response => {
          const status = response.status;
          return response.json().then(data => ({
            status: status,
            data: data
          }));
        })
        .then(result => {
          output.textContent =
            'Status: ' + result.status + '\n' +
            'Response:\n ' + JSON.stringify(result.data);
        })
        .catch(error => {
          output.textContent = error.message;
        });
    }
	
	
	function loadTutors() {

    const tutorSelect = document.getElementById("tutor");
    const teaches = document.getElementById("teaches");
	

    fetch('http://localhost:8080/getTutors')
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not load tutors");
            }
            return response.json();
        })
        .then(tutors => {

            tutorSelect.innerHTML = '<option value="">Select a tutor</option>';

            tutors.forEach(tutor => {

                const option = document.createElement("option");

                option.value = tutor.name;
                option.textContent = tutor.name;
                option.dataset.instrument = tutor.instrument.map(i => `${i.instrumentName} (Grade: ${i.minGrade} - ${i.maxGrade})`).join(" , ");

                tutorSelect.appendChild(option);

            });

        })
        .catch(error => {
            console.error(error);
        });
}

   function list_upcoming_lessons(){
    const output = document.getElementById('output');
    const stuId = document.getElementById('id').value;

    fetch('http://localhost:8080/viewAllBookings?id=' + encodeURIComponent(stuId))
        .then(response => {
            const status = response.status;
            return response.json().then(data => ({
                status: status,
                data: data
            }));
        })
        .then(result => {
            let display = 'Status: ' + result.status + '\n';

            result.data.forEach(booking => {
                display += '\nBooking ID: ' + booking.bookingId;
                display += '\nName: ' + booking.pup.name;
                display += '\nStudent ID: ' + booking.pup.studentid;
                display += '\nInstrument: ' + booking.instruments.instrumentName;
                display += '\nTutor: ' + booking.tutors.name;
                display += '\nDay: ' + booking.day;
                display += '\nTime: ' + booking.slot;
            });

            output.textContent = display;
        })
        .catch(error => {
            output.textContent = error.message;
        });
}

    
function book_lesson() {
    const output = document.getElementById('output');

    const name_val = document.getElementById('name').value;
    const studentId_val = document.getElementById('id').value;
    const day_val = document.getElementById("day").value;
    const timeSlot_val = document.getElementById("slot").value;
    const instrument_val = document.getElementById("instrument").value;
    const tutor_val = document.getElementById("tutor").value;

    // Check that the required fields have been entered 
    if (!name_val || !studentId_val || !tutor_val || !instrument_val) {
        output.textContent = "Please complete all booking details.";
        return;
    }

    const booking = {
        pup: {
            name: name_val,
            studentid: parseInt(studentId_val, 10)
        },
        instruments: {
            instrumentName: instrument_val
        },
        tutors: {
            name: tutor_val
        },
        day: day_val,
        time: timeSlot_val
    };

    fetch('http://localhost:8080/book', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(booking)
    })
    .then(response => {
        output.textContent = 'Status: ' + response.status;
        return response.text(); 
    })
    .then(body => {
        if (body) {
            output.textContent += '\nResponse: ' + body;
        }
    })
    .catch(error => {
        output.textContent = error.message;
    });
}


    function cancel_booking() {
      const output = document.getElementById('output');
      const studentId_val = document.getElementById('id').value;
	  const slot_val = document.getElementById("slot").value;
	  const day_val = document.getElementById("day").value;

 
      fetch('http://localhost:8080/cancelLesson', {
        method: 'DELETE',
		headers:{
		'Content-Type': 'application/json'
		},
		body: JSON.stringify({
		pup:{
		studentid: studentId_val
		},
		day: day_val
		})
		})
        .then(response => {
          output.textContent = 'Status: ' + response.status;
          return response.text();
        })
        .then(body => {
          if (body) {
            output.textContent += '\nResponse: ' + body;
          }
        })
        .catch(error => {
          output.textContent = error.message;
        });
    }
	
	document.getElementById("tutor").addEventListener("change", function() {

    const selectedTutor = this.options[this.selectedIndex];

    const instruments = selectedTutor.dataset.instrument || "";

    // Display all instruments taught
    document.getElementById("teaches").textContent = instruments;

    // Get the instrument dropdown
    const instrumentSelect = document.getElementById("instrument");

    // Clear existing options
    instrumentSelect.innerHTML = "";

    if (instruments === "") {
        instrumentSelect.innerHTML =
            '<option value="">Select a tutor first</option>';
        return;
    }

    // Add each instrument as an individual option
    const instrumentNames = instruments.split(", ");

    instrumentNames.forEach(name => {
	
		const cleanName = name.split(" (")[0];
        const option = document.createElement("option");
        option.value = cleanName;
        option.textContent = cleanName;
        instrumentSelect.appendChild(option);
    });

});
	

	window.addEventListener("DOMContentLoaded", loadTutors);
	
  </script>
  
  <style>
    #output {
        white-space: pre-wrap;
    }
  </style>
</body>
</html>
